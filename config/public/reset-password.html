<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - WorkYaar</title>

<link href="/css/theme.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter', Arial,sans-serif;
  background:var(--light-2);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:var(--card);
  padding:48px 40px;
  border-radius:var(--radius-lg);
  width:100%;
  max-width:440px;
  box-shadow:var(--shadow-lg);
}

h1{
  margin-bottom:24px;
  text-align:center;
  font-size:26px;
  font-weight:800;
  color:var(--dark);
}

input{
  width:100%;
  padding:14px;
  margin-bottom:20px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--light);
  font-size:14px;
  font-family:inherit;
  transition:all var(--transition);
  outline:none;
}

input:focus {
  border-color:var(--primary);
  background:var(--card);
  box-shadow:0 0 0 3px rgba(249,115,22,0.12);
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:var(--primary);
  color:#fff;
  border-radius:var(--radius-sm);
  cursor:pointer;
  font-weight:700;
  font-size:16px;
  transition:all var(--transition);
  box-shadow:0 4px 14px rgba(249,115,22,0.3);
}

button:hover{
  background:var(--primary-dark);
  transform:translateY(-1px);
}

button:disabled{
  background:var(--muted-light);
  color:var(--muted);
  cursor:not-allowed;
  box-shadow:none;
  transform:none;
}

#message{
  margin-top:20px;
  text-align:center;
  font-size:14px;
  font-weight:600;
  padding:12px;
  border-radius:8px;
}

#message[style*="red"] {
  background:#fee2e2;
  color:#b91c1c !important;
}

#message[style*="green"] {
  background:#d1fae5;
  color:#047857 !important;
}
</style>
</head>

<body>

<div class="card">

  <h1>Reset Password</h1>

  <form id="form">

    <input
      type="password"
      id="password"
      placeholder="New Password"
      required
    >

    <button type="submit" id="btn">
      Reset Password
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const form = document.getElementById("form");
const btn = document.getElementById("btn");
const message = document.getElementById("message");

/* =====================================
   1️⃣ TOKEN CHECK
====================================== */
if(!token){
  message.style.color = "red";
  message.innerText = "Invalid or missing reset token";
  form.style.display = "none";
}

/* =====================================
   2️⃣ RESET PASSWORD
====================================== */
form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const password = document.getElementById("password").value.trim();

  if(!password){
    message.style.color = "red";
    message.innerText = "Enter new password";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Resetting...";

  try{

    const res = await fetch(
      `/api/auth/reset-password/${token}`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({ password })
      }
    );

    const data = await res.json();

    if(res.ok && data.success){

      message.style.color = "green";
      message.innerText = data.message || "Password reset successful";

      setTimeout(()=>{
        window.location.href = "/login.html";
      }, 1500);

    } else {

      message.style.color = "red";
      message.innerText = data.message || "Reset failed";
    }

  }catch(err){

    message.style.color = "red";
    message.innerText = "Server error";
  }

  btn.disabled = false;
  btn.innerText = "Reset Password";

});

</script>

</body>
</html>
