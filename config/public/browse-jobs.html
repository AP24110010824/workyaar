<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse Jobs – WorkYaar</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="/css/theme.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
/* ================= OVERRIDES FOR BROWSE-JOBS.HTML ================= */
/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1240px;
  height:76px;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo img{
  height:40px;
}

.nav a{
  text-decoration:none;
  margin-left:24px;
  font-size:15px;
  font-weight:600;
  color:var(--dark);
  transition:color var(--transition);
}

.nav a:hover{
  color:var(--primary);
}

/* MAIN */
.container{
  max-width:1240px;
  margin:auto;
  padding:40px 24px;
  display:grid;
  grid-template-columns:280px 1fr;
  gap:32px;
  align-items:start;
}

/* FILTERS */
.filters{
  background:var(--card);
  padding:24px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  position:sticky;
  top:100px;
}

.filters h3{
  margin-bottom:20px;
  font-size:18px;
  display:flex;
  align-items:center;
  gap:8px;
}

.filters h3::before {
  content: '\f0b0';
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  color: var(--primary);
}

.filters input,
.filters select{
  width:100%;
  padding:12px 14px;
  margin-bottom:16px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  font-family:inherit;
  background:var(--light-2);
  transition:all var(--transition);
  outline:none;
}

.filters input:focus, .filters select:focus {
  border-color:var(--primary);
  background:var(--card);
}

.filters button{
  width:100%;
  padding:14px;
  background:var(--primary);
  color:white;
  border:none;
  border-radius:var(--radius-sm);
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:all var(--transition);
  box-shadow:0 4px 14px rgba(249,115,22,0.3);
}

.filters button:hover {
  background:var(--primary-dark);
  transform:translateY(-1px);
}

/* JOB LIST */
.jobs-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.jobs-header h2 {
  font-size:20px;
  font-weight:800;
}

.job-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:16px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  transition:all var(--transition);
  position:relative;
  overflow:hidden;
}

.job-card::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--primary); transform: scaleY(0); transform-origin: bottom; transition: transform var(--transition);
}

.job-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
  border-color:var(--primary);
}

.job-card:hover::after {
  transform: scaleY(1);
}

.job-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.company{
  color:var(--muted);
  font-size:14px;
  margin-bottom:12px;
  font-weight:500;
}

.meta{
  font-size:13px;
  color:var(--dark-3);
  margin-bottom:16px;
}

.actions{
  display:flex;
  gap:12px;
}

.btn{
  padding:10px 18px;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  border:none;
  transition:all var(--transition);
}

.apply{
  background:var(--primary);
  color:white;
  box-shadow:0 2px 8px rgba(249,115,22,0.25);
}

.apply:hover {
  background:var(--primary-dark);
}

.save{
  background:var(--light-2);
  color:var(--dark);
  border:1.5px solid var(--border);
}

.save:hover {
  background:var(--card);
  border-color:var(--muted-light);
}

.match{
  background:#d1fae5;
  color:#065f46;
  font-size:12px;
  padding:4px 10px;
  border-radius:99px;
  font-weight:600;
}

/* PAGINATION */
.pagination{
  display:flex;
  justify-content:center;
  margin-top:40px;
  gap:8px;
}

.pagination button{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:var(--radius-sm);
  font-weight:600;
  font-size:14px;
  color:var(--dark);
  cursor:pointer;
  transition:all var(--transition);
}

.pagination button:hover {
  border-color:var(--primary);
  color:var(--primary);
}

/* MOBILE */
@media(max-width:900px) {
  .container { grid-template-columns: 1fr; }
  .filters { position: static; }
  .nav a { display: none; } /* Hide links on mobile for now */
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
<img src="/images/workyaar-logo.png">
</div>

<div>
<a href="/">Home</a>
<a href="/browse-jobs.html">Jobs</a>
<a href="/login.html">Login</a>
</div>

</div>
</header>

<div class="container">

<!-- FILTER SIDEBAR -->

<div class="filters">

<h3>Search Jobs</h3>

<input id="keyword" placeholder="Skill or Job Title">

<input id="location" placeholder="Location">

<select id="type">
<option value="">Job Type</option>
<option>Full-Time</option>
<option>Part-Time</option>
<option>Contract</option>
<option>Remote</option>
</select>

<button onclick="loadJobs()">Search</button>

</div>


<!-- JOB RESULTS -->

<div>

<div class="jobs-header">
<h2>Available Jobs</h2>
</div>

<div id="jobsContainer"></div>

<div class="pagination" id="pagination"></div>

</div>

</div>

<script>

let currentPage = 1;

async function loadJobs(page=1){

currentPage = page;

const keyword = document.getElementById("keyword").value;
const location = document.getElementById("location").value;
const type = document.getElementById("type").value;

const params = new URLSearchParams({
page,
keyword,
location,
type
});

const res = await fetch(`/api/jobs?${params}`);
const data = await res.json();

renderJobs(data.jobs);
renderPagination(data.totalPages);

}

function renderJobs(jobs){

const container = document.getElementById("jobsContainer");

container.innerHTML="";

if(!jobs.length){
container.innerHTML="<p>No jobs found</p>";
return;
}

jobs.forEach(job=>{

const div=document.createElement("div");

div.className="job-card";

div.innerHTML=`

<div class="job-title">

${job.title}

<span class="match">${Math.floor(Math.random()*40+60)}% Match</span>

</div>

<div class="company">${job.company_name || "Company"}</div>

<div class="meta">
${job.location || "Remote"} • ${job.job_type || "Full-Time"}
</div>

<div class="actions">

<button class="btn apply" onclick="applyJob(${job.id})">
Apply
</button>

<button class="btn save" onclick="saveJob(${job.id})">
Save
</button>

</div>

`;

container.appendChild(div);

});

}

function renderPagination(total){

const container=document.getElementById("pagination");

container.innerHTML="";

for(let i=1;i<=total;i++){

const btn=document.createElement("button");

btn.innerText=i;

btn.onclick=()=>loadJobs(i);

container.appendChild(btn);

}

}

async function applyJob(jobId){

const token = localStorage.getItem("token");

if(!token){
alert("Please login to apply");
window.location.href="/login.html";
return;
}

const res = await fetch(`/api/jobs/${jobId}/apply`,{
method:"POST",
headers:{
"Authorization":"Bearer "+token
}
});

const data=await res.json();

alert(data.message || "Application submitted");

}

async function saveJob(jobId){

const token = localStorage.getItem("token");

if(!token){
alert("Login required");
return;
}

const res = await fetch(`/api/jobs/${jobId}/save`,{
method:"POST",
headers:{
"Authorization":"Bearer "+token
}
});

const data = await res.json();

alert(data.message || "Job saved");

}

loadJobs();

</script>

</body>
</html>
