<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - WorkYaar</title>

<link href="/css/global.css" rel="stylesheet">
<link href="/css/pages/forgot-password.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="card">

  <h1>Forgot Password</h1>

  <form id="form">

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <button type="submit" id="btn">
      Send Reset Link
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

const form = document.getElementById("form");
const btn = document.getElementById("btn");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = document.getElementById("email").value.trim();

  if(!email){
    message.style.color = "red";
    message.innerText = "Please enter email";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Sending...";

  try{

    const res = await fetch("/api/auth/forgot-password", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ email })
    });

    const data = await res.json();

    if(res.ok && data.success){
      message.style.color = "green";
      message.innerText = data.message || "Reset link sent!";
    } else {
      message.style.color = "red";
      message.innerText = data.message || "Failed to send reset link";
    }

  }catch(err){
    message.style.color = "red";
    message.innerText = "Server error";
  }

  btn.disabled = false;
  btn.innerText = "Send Reset Link";

});

</script>

</body>
</html>
