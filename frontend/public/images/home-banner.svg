<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Modern WorkYaar workspace banner</title>
  <desc id="desc">A bright premium workspace illustration with desk, laptop, plants, profile cards, and job metrics.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity=".75"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#e9d5ff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1d4ed8" flood-opacity=".14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1400" height="560" rx="32" fill="url(#room)"/>
  <rect x="34" y="34" width="1332" height="492" rx="28" fill="url(#glass)" stroke="#dbeafe"/>

  <g opacity=".55">
    <path d="M130 88h1130M130 150h1130M130 212h1130M130 274h1130M130 336h1130M130 398h1130M130 460h1130" stroke="#dbeafe"/>
    <path d="M170 72v420M270 72v420M370 72v420M470 72v420M570 72v420M670 72v420M770 72v420M870 72v420M970 72v420M1070 72v420M1170 72v420" stroke="#dbeafe"/>
  </g>

  <rect x="130" y="126" width="1000" height="320" rx="28" fill="#ffffff" opacity=".78" stroke="#dbeafe"/>
  <path d="M130 316h1000v130H130z" fill="#eff6ff" opacity=".62"/>

  <g filter="url(#shadow)">
    <rect x="168" y="330" width="1050" height="54" rx="27" fill="#e2e8f0"/>
    <rect x="142" y="300" width="1100" height="86" rx="43" fill="#ffffff"/>
    <rect x="190" y="292" width="470" height="44" rx="22" fill="#eff6ff"/>
    <circle cx="228" cy="314" r="12" fill="#3b82f6"/>
    <rect x="250" y="306" width="250" height="16" rx="8" fill="#94a3b8" opacity=".55"/>
  </g>

  <g transform="translate(645 170)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="150" rx="18" fill="#ffffff"/>
    <rect x="28" y="24" width="164" height="92" rx="12" fill="#eff6ff"/>
    <path d="M54 116h112l18 28H36z" fill="#c7d2fe"/>
    <path d="M64 46h100v44H64z" fill="url(#blue)" opacity=".9"/>
    <circle cx="92" cy="68" r="14" fill="#ffffff" opacity=".92"/>
    <rect x="112" y="58" width="38" height="8" rx="4" fill="#ffffff" opacity=".75"/>
    <rect x="112" y="76" width="28" height="8" rx="4" fill="#ffffff" opacity=".55"/>
  </g>

  <g transform="translate(942 95)" filter="url(#softShadow)">
    <rect width="250" height="140" rx="22" fill="#ffffff"/>
    <text x="28" y="48" fill="#64748b" font-family="Inter, Arial" font-size="14" font-weight="800" letter-spacing="4">REMOTE ROLES</text>
    <text x="28" y="96" fill="#0f172a" font-family="Inter, Arial" font-size="54" font-weight="900">2,400+</text>
    <text x="30" y="120" fill="#64748b" font-family="Inter, Arial" font-size="15">Open this week</text>
  </g>

  <g transform="translate(160 270)" filter="url(#softShadow)">
    <rect width="290" height="150" rx="22" fill="#ffffff"/>
    <text x="36" y="50" fill="#64748b" font-family="Inter, Arial" font-size="14" font-weight="800" letter-spacing="4">PRODUCT DESIGN</text>
    <text x="36" y="104" fill="#0f172a" font-family="Inter, Arial" font-size="58" font-weight="900">94%</text>
    <text x="36" y="128" fill="#64748b" font-family="Inter, Arial" font-size="15">Talent match score</text>
  </g>

  <g transform="translate(1012 340)" filter="url(#softShadow)">
    <rect width="280" height="134" rx="24" fill="#ffffff"/>
    <circle cx="54" cy="54" r="28" fill="#dbeafe"/>
    <text x="42" y="64" fill="#2563eb" font-family="Inter, Arial" font-size="22" font-weight="900">JD</text>
    <text x="94" y="48" fill="#334155" font-family="Inter, Arial" font-size="18" font-weight="800">John Doe</text>
    <text x="94" y="72" fill="#64748b" font-family="Inter, Arial" font-size="14">Senior Product Designer</text>
    <rect x="28" y="96" width="58" height="24" rx="12" fill="#eff6ff"/>
    <rect x="98" y="96" width="58" height="24" rx="12" fill="#eff6ff"/>
    <rect x="168" y="96" width="70" height="24" rx="12" fill="#eff6ff"/>
    <text x="43" y="112" fill="#2563eb" font-family="Inter, Arial" font-size="12" font-weight="800">Figma</text>
    <text x="114" y="112" fill="#2563eb" font-family="Inter, Arial" font-size="12" font-weight="800">React</text>
    <text x="183" y="112" fill="#2563eb" font-family="Inter, Arial" font-size="12" font-weight="800">Webflow</text>
  </g>

  <g opacity=".8">
    <circle cx="1210" cy="284" r="74" fill="#bfdbfe" opacity=".28"/>
    <circle cx="1130" cy="260" r="36" fill="#c4b5fd" opacity=".28"/>
    <circle cx="260" cy="158" r="58" fill="#bfdbfe" opacity=".22"/>
  </g>
</svg>
