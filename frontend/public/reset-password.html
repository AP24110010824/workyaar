<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - WorkYaar</title>

<link href="/css/global.css" rel="stylesheet">
<link href="/css/pages/reset-password.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="card">

  <h1>Reset Password</h1>

  <form id="form">

    <input
      type="password"
      id="password"
      placeholder="New Password"
      required
    >

    <button type="submit" id="btn">
      Reset Password
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const form = document.getElementById("form");
const btn = document.getElementById("btn");
const message = document.getElementById("message");

/* =====================================
   1ï¸âƒ£ TOKEN CHECK
====================================== */
if(!token){
  message.style.color = "red";
  message.innerText = "Invalid or missing reset token";
  form.style.display = "none";
}

/* =====================================
   2ï¸âƒ£ RESET PASSWORD
====================================== */
form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const password = document.getElementById("password").value.trim();

  if(!password){
    message.style.color = "red";
    message.innerText = "Enter new password";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Resetting...";

  try{

    const res = await fetch(
      `/api/auth/reset-password/${token}`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({ password })
      }
    );

    const data = await res.json();

    if(res.ok && data.success){

      message.style.color = "green";
      message.innerText = data.message || "Password reset successful";

      setTimeout(()=>{
        window.location.href = "/login.html";
      }, 1500);

    } else {

      message.style.color = "red";
      message.innerText = data.message || "Reset failed";
    }

  }catch(err){

    message.style.color = "red";
    message.innerText = "Server error";
  }

  btn.disabled = false;
  btn.innerText = "Reset Password";

});

</script>

</body>
</html>
